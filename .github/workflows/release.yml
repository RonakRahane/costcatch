name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # npm exchanges this OIDC token for a provenance attestation.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing requires npm 11.15.0 or newer.
      - run: npm install --global npm@11.15.0
      - run: npm --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check --quiet httpx httpx2 requests

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify source and build
        run: npm run typecheck && npm run build

      # Stage the release for maintainer review and 2FA approval on npm.
      - name: Stage package on npm
        run: npm stage publish
